server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-font-ttf image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — все маршруты отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгосрочное кеширование статических ассетов (Vite добавляет хеш к именам)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
